<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>POS</title>
    <link rel="stylesheet" href="../../vendor/semantic-ui/semantic.min.css">
    <link rel="stylesheet" href="../../styles/global.min.css">
    <link rel="stylesheet" href="./index.min.css">
</head>

<body>
    <div class="app-container">
        <div class="topbar">
            <div class="app-name">TeleMart</div>
            <div class="spacer"></div>
            <div class="widgets">
                <div class="timestamp">2:15pm</div>
                <div class="user">
                    <i class="user icon"></i> Joesac
                </div>
            </div>
        </div>
        <div class="products-current-sale-container">
            <div class="products">
                    <div class="menu">
                            <button class="ui button big youtube" id="btnNew">New</button>
                        </div>
                <div class="search-container">
                    <div class="ui fluid input icon">
                        <input type="text" id="txtSearch" placeholder="Search for a product to sell...">
                        <i class="icon search"></i>
                    </div>
                </div>
                <div class="display-search-results-wrapper">
                </div>
                <div class="checkout-holder">
                    <button class="ui button green fluid" id="btnChargeCash">Charge</button>
                    <button class="ui button green fluid" id="btnChargeCheque">Cheque</button>
                </div>
            </div>
            <div class="current-sale">
                <h2>Current Sales</h2>
                <div class="cart">
                    <table class="ui very basic table" id="tblCart">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>

                <div class="total-container">
                    <div>
                        <h3>TOTAL</h3>
                    </div>
                    <div class="spacer"></div>
                    <div class="total" id="totalVal">
                        <h3>GHC 0.00</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Amount Customer Paid Modal -->
    <div class="ui modal tiny" id="amountCustomerPaidModal">
        <div class="header">
            Cash Received
        </div>
        <div class="content">
            <div class="ui input big fluid">
                <input type="text" id="txtAmountReceived" placeholder="GHC0.00" style="text-align: right;">
            </div>
        </div>
        <div class="actions">
            <button class="ui button red" id="btnCancelAmountCustomerPaidModal">Cancel</button>
            <button class="ui button green" id="btnCheckoutAmountCustomerPaid">Ok</button>
        </div>
    </div>

    <!-- Print Checkout Receipt Modal -->
    <div class="ui modal basic" id="printCheckoutReceiptModal">
        <i class="close icon"></i>
        <div class="header">
            Print Receipt?
        </div>
        <div class="image content">
            <button class="ui button green massive" id="btnPrintReceipt">Print</button>
            <button class="ui button red massive" id="btnClosePrintReceiptModal">Cancel</button>
        </div>
    </div>

    <script>
        if (typeof module === 'object') {
            window.module = module;
            module = undefined;
        }
    </script>
    <script src="../../vendor/jquery-3.4.1.min.js"></script>
    <script src="../../vendor/semantic-ui/semantic.min.js"></script>
    <!-- <script src="../../vendor/semantic-ui/calendar.min.js"></script>
    <script src="../../vendor/semantic-ui/range-slider.js"></script> -->
    <script src="./index.js"></script>
    <script>
        if (window.module) module = window.module;
    </script>
</body>

</html>
