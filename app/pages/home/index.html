<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>POS</title>
    <link rel="stylesheet" href="../../vendor/semantic-ui/semantic.min.css">
    <link rel="stylesheet" href="../../styles/global.min.css">
    <link rel="stylesheet" href="./index.min.css">
</head>

<body>

    <div class="app-container">
        <div class="topbar">
            <div class="app-name">TeleMart</div>
            <div class="spacer"></div>
            <div class="widgets">
                <div class="timestamp">2:15pm</div>
                <div class="user">
                    <i class="user icon"></i> Joesac
                </div>
            </div>
        </div>
        <div class="products-current-sale-container">
            <div class="products">
                <div class="search-container">
                    <div class="ui fluid input icon">
                        <input type="text" id="txtSearch" placeholder="Search for a product to sell...">
                        <i class="icon search"></i>
                    </div>
                </div>
                <div class="display-search-results-wrapper">
                </div>
                <div class="checkout-holder">
                    <button class="ui button green fluid" id="btnCharge">Charge</button>
                    <button class="ui button green fluid" id="btnCheque">Cheque</button>
                </div>
            </div>
            <div class="current-sale">
                <h2>Current Sales</h2>
                <div class="cart">
                    <table class="ui very basic table" id="tblCart">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>

                <div class="total-container">
                    <div class="total"><h3>TOTAL</h3></div>
                    <div class="spacer"></div>
                    <div class="total"><h3>GHC 384</h3></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (typeof module === 'object') {
            window.module = module;
            module = undefined;
        }
    </script>
    <script src="../../vendor/jquery-3.4.1.min.js"></script>
    <script src="../../vendor/semantic-ui/semantic.min.js"></script>
    <!-- <script src="../../vendor/semantic-ui/calendar.min.js"></script>
    <script src="../../vendor/semantic-ui/range-slider.js"></script> -->
    <script src="./index.js"></script>
    <script>
        if (window.module) module = window.module;
    </script>
</body>

</html>
