<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Splashscreen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
        }
        
        .wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none !important;
        }

        .splash-img {
            width: 100%;
            height: auto;
            -webkit-user-select: none;
            user-select: none;
        }

        /* .progress {

        }

        .ui.progress.success .bar {
            background-color: white !important;
        } */
    </style>
</head>
<body>
    <div class="wrapper">
        <img src="../../assets/splashscreen.svg" class="splash-img">

</html>
