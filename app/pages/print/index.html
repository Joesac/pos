<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="../../vendor/semantic-ui/semantic.min.css"> -->
    <link rel="stylesheet" href="../../styles/global.min.css">
    <link rel="stylesheet" href="./index.min.css">
</head>

<body>
    <div class="container">
        <div class="about-company">
            Be-Nice Ventures<br>
            P.O.Box RY127<br>
            Kumasi - Ghana<br>
            Loc: Abuakwa - Maakro<br>
            Tel: 0244831710/0546597114
        </div>

        <div class="table-receipt-preamble">
            <table>
                <tbody>
                    <tr>
                        <td>Bill No.</td>
                        <td id="billNo">bill no.</td>
                    </tr>
                    <tr>
                        <td>Date</td>
                        <td id="timestamp">date</td>
                    </tr>
                    <tr>
                        <td>User</td>
                        <td id="user"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <hr width="100%">
        <div class="table-container">
            <table>
                <thead>
                    <th>Description</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Amt</th>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
        <hr width="100%">
        <div class="total-container">
            <table>
                <tr>
                    <td>
                        <h3>TOTAL</h3>
                    </td>
                    <td class="total">
                        <h3 id="receiptTotalVal"></h3>
                    </td>
                </tr>
            </table>
        </div>

        <div class="money-issues">
            <div>Amount Received: GHC<span class="amountReceived"></span></div>
            <div>Change: GHC<span class="changeGiven"></span></div>
            <div>Discount: <span class="receiptDiscount"></span></div>
            <div>Discount Qualify Amount: GHC<span class="receiptDiscountCondAmt"></span></div>
        </div>

        <div class="footer">
            Thanks for shopping with us<br><br>
            Software by: PlainBlue 0542462657
        </div>
    </div>

    <script>
        if (typeof module === 'object') {
            window.module = module;
            module = undefined;
        }
    </script>
    <script src="../../vendor/jquery-3.4.1.min.js"></script>
    <!-- <script src="../../vendor/semantic-ui/semantic.min.js"></script> -->
    <!-- <script src="../../vendor/semantic-ui/calendar.min.js"></script>
            <script src="../../vendor/semantic-ui/range-slider.js"></script> -->
    <script src="./index.js"></script>
    <script>
        if (window.module) module = window.module;
    </script>
</body>

</html>
